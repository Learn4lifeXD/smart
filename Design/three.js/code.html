<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a high-end 3D "Gemini Orb" - glowing glass sphere with internal geometry
const group = new THREE.Group();
scene.add(group);

const sphereGeom = new THREE.SphereGeometry(1.5, 64, 64);
const sphereMat = new THREE.MeshPhongMaterial({
    color: 0x006039,
    emissive: 0x006039,
    specular: 0xffffff,
    shininess: 100,
    transparent: true,
    opacity: 0.4,
});
const sphere = new THREE.Mesh(sphereGeom, sphereMat);
group.add(sphere);

// Internal wireframe core
const coreGeom = new THREE.IcosahedronGeometry(1.2, 1);
const coreMat = new THREE.MeshBasicMaterial({
    color: 0xD4AF37,
    wireframe: true,
    transparent: true,
    opacity: 0.8
});
const core = new THREE.Mesh(coreGeom, coreMat);
group.add(core);

const light = new THREE.PointLight(0xD4AF37, 2, 10);
light.position.set(2, 2, 2);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    group.rotation.y += 0.005;
    group.rotation.x += 0.003;
    
    // Pulsing effect
    const scale = 1 + Math.sin(time * 2) * 0.05;
    group.scale.set(scale, scale, scale);
    
    // Core counter-rotation
    core.rotation.y -= 0.01;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
