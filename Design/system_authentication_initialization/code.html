<style>
        /* Custom Animations & Effects */
        .glass-panel {
            background: rgba(26, 26, 26, 0.6); /* Translucent Charcoal approximation */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(233, 195, 73, 0.2); /* secondary/20 */

        .ambient-glow-tl {
            background: radial-gradient(circle, rgba(136, 215, 166, 0.08) 0%, transparent 70%); /* primary/8 */
        }

            background: radial-gradient(circle, rgba(136, 215, 166, 0.05) 0%, transparent 70%); /* primary/5 */
        }

        .css-grid-bg {
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        @keyframes progress-fill {
            0% { transform: scaleX(0); opacity: 0.8; }
            50% { transform: scaleX(0.7); opacity: 1; box-shadow: 0 0 15px rgba(233, 195, 73, 0.6); }
            100% { transform: scaleX(1); opacity: 0.8; }
        }

        .animate-progress {
            transform-origin: left;
            animation: progress-fill 4s ease-in-out infinite alternate;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(233, 195, 73, 0.3);

<body class="bg-surface-container-lowest min-h-screen w-full flex items-center justify-center overflow-hidden relative">
<!-- Atmospheric Deep Background Elements -->
<div class="absolute inset-0 css-grid-bg pointer-events-none z-0"></div>

<div class="absolute -bottom-[307px] -right-[20vw] w-[90vw] h-[90vw] rounded-full ambient-glow-br pointer-events-none z-0 mix-blend-screen"></div>

<main class="relative z-10 w-full max-w-[720px] px-gutter mx-auto flex flex-col items-center">

<!-- Subtle internal top highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-secondary/40 to-transparent"></div>

<div class="relative w-40 h-40 mb-section-gap flex items-center justify-center">
<!-- Outer ambient blur -->
<div class="absolute inset-0 bg-secondary/5 rounded-full blur-xl animate-pulse"></div>
<!-- Slow outer orbital ring -->
<div class="absolute inset-2 rounded-full border border-secondary/10 border-t-secondary/60 animate-[spin_4s_linear_infinite]"></div>
<!-- Medium middle dashed ring -->
<div class="absolute inset-6 rounded-full border-2 border-dashed border-secondary/30 border-l-secondary/80 animate-[spin_2.5s_linear_infinite_reverse]"></div>
<!-- Inner precision solid ring -->
<div class="absolute inset-10 rounded-full border-[1.5px] border-secondary/20 border-r-secondary animate-[spin_1s_linear_infinite]"></div>
<!-- Central Icon Core -->
<div class="relative z-10 flex items-center justify-center bg-surface-container-lowest/50 backdrop-blur-md rounded-full w-12 h-12 border border-secondary/20 shadow-[0_0_15px_rgba(233,195,73,0.15)]">
<span class="material-symbols-outlined font-label-md text-secondary" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>

<span>Initializing Secure Protocol</span>
<span class="inline-block w-8 text-left" id="loading-dots"></span>
</h1>
<p class="font-label-md text-label-md text-secondary/60 tracking-[0.1em]">

</div>
<!-- Faint numeric indicator -->

                    SYS.OP.99.2A
                </div>
</div>

</main>
<!-- Lightweight Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dotsElement = document.getElementById('loading-dots');
            let dotCount = 0;
            
            // Simple animated dots for the '...' effect without layout shift
            setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                dotsElement.textContent = '.'.repeat(dotCount);
            }, 500);
        });
    </script>
